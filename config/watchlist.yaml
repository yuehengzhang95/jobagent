# Companies the Scout checks. Every greenhouse/lever/ashby slug below was verified live on 2026-10-14.
# ats: greenhouse | lever | ashby (slug) · eightfold (host, domain) · workday (host, tenant, site)
#      web (Claude + WebSearch; ~$0.10 per company per scout, for sites without a public API)
# Set `enabled: false` to pause a company. Leave out your current employer.

# Search terms for adapters that search (eightfold, workday, web). Board adapters list everything.
queries: [machine learning, applied scientist, research scientist, AI engineer, LLM]

companies:
